<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ngọc Vũ & Thanh Huệ | Wedding Invitation</title>
<meta name="theme-color" content="#65090d">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7eee7;color:#5b0b0f;font-family:Georgia,'Times New Roman',serif}body{overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:50;background:#f7eee7;display:flex;justify-content:center;align-items:center;transition:opacity .65s ease,visibility .65s ease}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}.stage{position:relative;width:min(100vw,520px);height:100svh;max-height:calc(100vw * 1748 / 1240);overflow:hidden;background:#f7eee7;box-shadow:0 0 40px #0002;cursor:pointer}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .55s ease}.stage img.active{opacity:1}.hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:#65090dcc;color:#fff;font-size:14px;letter-spacing:.03em;white-space:nowrap;z-index:3;box-shadow:0 4px 18px #0003;animation:pulse 1.7s infinite}@keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}
main{width:min(100%,620px);margin:auto;background:#f8efe8;box-shadow:0 0 30px #0001}.page{position:relative;line-height:0}.page img{display:block;width:100%;height:auto;margin:0;padding:0}.hotspot{position:absolute;display:block;border-radius:16px;background:transparent;cursor:pointer}.calendar{left:29%;top:79%;width:42%;height:7%}.rsvp{left:29%;top:86%;width:42%;height:7%}.map{left:15%;top:37%;width:70%;height:52%}.guest{left:39%;top:55%;width:38%;height:8%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;background:#65090d;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 5px 22px #0003;font:14px Arial,sans-serif}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){body{padding:24px 0}.stage{height:min(100svh,735px)}main{border-radius:4px;overflow:hidden}}
@media(prefers-reduced-motion:reduce){.stage img,#intro,.toast{transition:none}.hint{animation:none}}
.page{
  position:relative;
}

.hotspot{
  position:absolute;
  display:block;
  z-index:10;
}

.calendar{
  left:30%;
  top:3%;
  width:40%;
  height:7%;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="intro" aria-label="Mở thiệp cưới">
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Nhấn để mở thiệp">
    <img src="page-01.png" class="active" alt="Phong bì thiệp cưới">
    <img src="page-02.png" alt="Phong bì">
    <img src="page-03.png" alt="Phong bì mở">
    <img src="page-04.png" alt="Ảnh cưới xuất hiện">
    <img src="page-05.png" alt="Ảnh cưới">
    <div class="hint" id="hint">Chạm để mở thiệp ♡</div>
  </div>
</div>
<main id="content" aria-label="Thiệp cưới Ngọc Vũ và Thanh Huệ">
  <section class="page"><img src="page-06.png" alt="Ngọc Vũ và Thanh Huệ - Thông tin lễ cưới"></section>
  <section class="page"><img src="page-07.png" alt="Thông tin cô dâu chú rể"></section>
  <section class="page"><img src="page-08.png" alt="Album ảnh cưới"></section>
  <section class="page"><img src="page-09.png" alt="Album ảnh và thông tin tiệc cưới"></section>
<section class="page">
  <img src="page-10.png" alt="Ngày cưới và lịch tháng 9 năm 2026">
</section>

<section class="page">
  <img src="page-11.png" alt="Địa điểm tổ chức tiệc cưới">

  <a
    class="hotspot calendar"
href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ti%E1%BB%87c+c%C6%B0%E1%BB%9Bi+Ng%E1%BB%8Dc+V%C5%A9+%26+Thanh+Hu%E1%BB%87&dates=20260912T020000Z/20260912T050000Z&location=Nh%C3%A0+V%C4%83n+H%C3%B3a+Th%C3%B4n+An+Chi%E1%BB%83u+1%2C+Ph%E1%BB%91+Hi%E1%BA%BFn%2C+H%C6%B0ng+Y%C3%AAn"
  </a>

  <a
    class="hotspot map"
href="https://www.google.com/maps/search/?api=1&amp;query=Nh%C3%A0+V%C4%83n+H%C3%B3a+Th%C3%B4n+An+Chi%E1%BB%83u+1%2C+Ph%E1%BB%91+Hi%E1%BA%BFn%2C+H%C6%B0ng+Y%C3%AAn"
  </a>
</section>
  <section class="page" id="guestbook"><img src="page-12.png" alt="Sổ lưu bút"><a class="hotspot guest" id="guestBtn" href="#" aria-label="Gửi lời chúc"></a></section>
</main>
<div class="toast" id="toast"></div>
<script>
const intro = document.getElementById('intro');
const stage = document.getElementById('stage');
const frames = [...stage.querySelectorAll('img')];
const hint = document.getElementById('hint');

let running = false;

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function playIntro() {
  if (running) return;
  running = true;

  hint.style.display = 'none';

  for (let i = 1; i < frames.length; i++) {
    frames.forEach((img, index) => {
      img.classList.toggle('active', index === i);
    });

    await sleep(700);
  }

  await sleep(800);

  intro.classList.add('done');
  running = false;
}

stage.addEventListener('click', playIntro);

stage.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    playIntro();
  }
});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
document.getElementById('calendarBtn').addEventListener('click', function(e) {
  e.preventDefault();

  const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Ngoc Vu Thanh Hue Wedding//VI
BEGIN:VEVENT
UID:ngoc-vu-thanh-hue-12092026
DTSTAMP:20260825T000000Z
DTSTART:20260912T020000Z
DTEND:20260912T050000Z
SUMMARY:Tiệc cưới Ngọc Vũ & Thanh Huệ
LOCATION:Nhà Văn Hóa Thôn An Chiểu 1, Phố Hiến, Hưng Yên
DESCRIPTION:Trân trọng mời bạn đến tham dự tiệc cưới của Ngọc Vũ và Thanh Huệ.
END:VEVENT
END:VCALENDAR`;

  const blob = new Blob([icsContent], {
    type: 'text/calendar;charset=utf-8'
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'Dam-cuoi-Ngoc-Vu-Thanh-Hue.ics';

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
document.getElementById('rsvpBtn').addEventListener('click',()=>toast('Kéo xuống Sổ lưu bút để phản hồi'));
document.getElementById('guestBtn').addEventListener('click',e=>{e.preventDefault();toast('Phần gửi lời chúc cần nối với biểu mẫu/Google Sheet')});
</script>
</body></html>
