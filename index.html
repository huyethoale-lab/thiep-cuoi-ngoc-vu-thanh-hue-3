<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ngọc Vũ & Thanh Huệ | Wedding Invitation</title>
<meta name="theme-color" content="#65090d">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7eee7;color:#5b0b0f;font-family:Georgia,'Times New Roman',serif}body{overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:50;background:#f7eee7;display:flex;justify-content:center;align-items:center;transition:opacity .65s ease,visibility .65s ease}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}.stage{position:relative;width:min(100vw,520px);height:100svh;max-height:calc(100vw * 1748 / 1240);overflow:hidden;background:#f7eee7;box-shadow:0 0 40px #0002;cursor:pointer}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .55s ease}.stage img.active{opacity:1}.hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:#65090dcc;color:#fff;font-size:14px;letter-spacing:.03em;white-space:nowrap;z-index:3;box-shadow:0 4px 18px #0003;animation:pulse 1.7s infinite}@keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}
main{width:min(100%,620px);margin:auto;background:#f8efe8;box-shadow:0 0 30px #0001}.page{position:relative;line-height:0}.page img{display:block;width:100%;height:auto;margin:0;padding:0}.hotspot{position:absolute;display:block;border-radius:16px;background:transparent;cursor:pointer}.calendar{left:29%;top:79%;width:42%;height:7%}.rsvp{left:29%;top:86%;width:42%;height:7%}.map{left:15%;top:37%;width:70%;height:52%}.guest{left:39%;top:55%;width:38%;height:8%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;background:#65090d;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 5px 22px #0003;font:14px Arial,sans-serif}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:700px){body{padding:24px 0}.stage{height:min(100svh,735px)}main{border-radius:4px;overflow:visible}}
@media(prefers-reduced-motion:reduce){.stage img,#intro,.toast{transition:none}.hint{animation:none}}
.page{
  position:relative;
}

.hotspot{
  position:absolute;
  display:block;
  z-index:10;
}

.calendar{
  left:30%;
  top:3%;
  width:40%;
  height:7%;
  cursor:pointer;
}
.rsvp{
  left:28%;
  top:15%;
  width:44%;
  height:7%;
  cursor:pointer;
  z-index:30;
  pointer-events:auto;
}
.page{
  position:relative;
}

.page img{
  display:block;
  width:100%;
  height:auto;
  margin:0;
  padding:0;
}
</style>
</head>
<body>
<div id="intro" aria-label="Mở thiệp cưới">
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Nhấn để mở thiệp">
    <img src="page-01.png" class="active" alt="Phong bì thiệp cưới">
    <img src="page-02.png" alt="Phong bì">
    <img src="page-03.png" alt="Phong bì mở">
    <img src="page-04.png" alt="Ảnh cưới xuất hiện">
    <img src="page-05.png" alt="Ảnh cưới">
    <div class="hint" id="hint">Chạm để mở thiệp ♡</div>
  </div>
</div>
<main id="content" aria-label="Thiệp cưới Ngọc Vũ và Thanh Huệ">
  <section class="page"><img src="page-06.png" alt="Ngọc Vũ và Thanh Huệ - Thông tin lễ cưới"></section>
  <section class="page"><img src="page-07.png" alt="Thông tin cô dâu chú rể"></section>
  <section class="page"><img src="page-08.png" alt="Album ảnh cưới"></section>
  <section class="page"><img src="page-09.png" alt="Album ảnh và thông tin tiệc cưới"></section>
<section class="page">
  <img src="page-10.png" alt="Ngày cưới và lịch tháng 9 năm 2026">
</section>

<section class="page">
  <img src="page-11.png" alt="Địa điểm tổ chức tiệc cưới">

  <a
    class="hotspot calendar"
href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Ti%E1%BB%87c+c%C6%B0%E1%BB%9Bi+Ng%E1%BB%8Dc+V%C5%A9+%26+Thanh+Hu%E1%BB%87&dates=20260912T020000Z/20260912T050000Z&location=Nh%C3%A0+V%C4%83n+H%C3%B3a+Th%C3%B4n+An+Chi%E1%BB%83u+1%2C+Ph%E1%BB%91+Hi%E1%BA%BFn%2C+H%C6%B0ng+Y%C3%AAn"
  </a>

    <a
  class="hotspot rsvp"
 href="https://docs.google.com/forms/d/e/1FAIpQLSdIgmfYj_vwQLhg7VEwXS2bn3JtlXgalNKoHSAVzCf-H0H_PQ/viewform?usp=publish-editor"
  aria-label="Xác nhận tham dự">
</a>
 
    <a
    class="hotspot map"
href="https://www.google.com/maps/search/?api=1&amp;query=Nh%C3%A0+V%C4%83n+H%C3%B3a+Th%C3%B4n+An+Chi%E1%BB%83u+1%2C+Ph%E1%BB%91+Hi%E1%BA%BFn%2C+H%C6%B0ng+Y%C3%AAn"
  </a>
</section>
    <section class="section page12">
      <img src="page-12.png" alt="Sổ lưu bút">
      <form class="guest-form" id="guestForm">
        <input id="guestName" autocomplete="name" aria-label="Nhập tên" placeholder="">
        <textarea id="guestWish" aria-label="Nhập lời chúc" placeholder=""></textarea>
        <button type="submit" aria-label="Gửi lời chúc">Gửi</button>
      </form>
    </section>
  </main>
  <div class="footer-note">Thiệp cưới của Ngọc Vũ & Thanh Huệ · 12.09.2026</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="rsvpModal" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
  <form class="card" id="rsvpForm">
    <h2 id="rsvpTitle">Xác nhận tham dự</h2>
    <label for="rsvpName">Tên của bạn</label><input id="rsvpName" required>
    <label for="rsvpStatus">Bạn có thể tham dự?</label>
    <select id="rsvpStatus"><option value="yes">Có, mình sẽ tham dự</option><option value="no">Rất tiếc, mình không thể tham dự</option></select>
    <label for="rsvpCount">Số người tham dự</label><input id="rsvpCount" type="number" min="1" max="10" value="1">
    <label for="rsvpNote">Lời nhắn</label><textarea id="rsvpNote" rows="3"></textarea>
    <div class="actions"><button type="button" class="secondary" id="closeRsvp">Đóng</button><button type="submit" class="primary">Gửi xác nhận</button></div>
  </form>
</div>

<script>
const frames=[...document.querySelectorAll('.intro img')];
const seal=document.getElementById('seal'),cue=document.getElementById('scrollCue'),replay=document.getElementById('replay');
let running=false;
const waits=[450,650,600,700,780,950];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function playIntro(){
  if(running)return;
  running=true; seal.classList.add('hidden'); cue.classList.remove('show'); replay.classList.remove('show');
  for(let i=0;i<frames.length;i++){
    frames.forEach((f,j)=>f.classList.toggle('active',i===j));
    await sleep(waits[i]);
  }
  cue.classList.add('show'); replay.classList.add('show'); running=false;
}
seal.addEventListener('click',playIntro);
replay.addEventListener('click',()=>{
  frames.forEach((f,j)=>f.classList.toggle('active',j===0));
  seal.classList.remove('hidden'); cue.classList.remove('show'); replay.classList.remove('show')
});
cue.addEventListener('click',()=>document.getElementById('content').scrollIntoView({behavior:'smooth'}));

const weddingTime=new Date('2026-09-12T09:00:00+07:00');
function updateCountdown(){
  let d=weddingTime-new Date(), el=document.getElementById('countdown');
  if(d<=0){el.textContent='Hôm nay là ngày vui của chúng mình!';return}
  const day=Math.floor(d/86400000); d%=86400000;
  const h=Math.floor(d/3600000); d%=3600000;
  const m=Math.floor(d/60000), s=Math.floor((d%60000)/1000);
  el.textContent=`${day} ngày ${h} giờ ${m} phút ${s} giây`;
}
updateCountdown(); setInterval(updateCountdown,1000);

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show'),2600)
}

document.getElementById('addCalendar').addEventListener('click',()=>{
  const ics=`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Wedding Invitation//VI
BEGIN:VEVENT
UID:ngocvu-thanhhue-20260912@example.local
DTSTAMP:20260823T000000Z
DTSTART:20260912T020000Z
SUMMARY:Tiệc cưới Ngọc Vũ & Thanh Huệ
LOCATION:Nhà Văn Hóa Thôn An Chiểu 1, Phố Hiến, Hưng Yên
DESCRIPTION:Trân trọng mời bạn đến chung vui cùng Ngọc Vũ và Thanh Huệ.
END:VEVENT
END:VCALENDAR`;
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dam-cuoi-ngoc-vu-thanh-hue.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Đã tạo lịch cưới để bạn lưu');
});

const modal=document.getElementById('rsvpModal');
document.getElementById('openRsvp').addEventListener('click',()=>modal.classList.add('show'));
document.getElementById('closeRsvp').addEventListener('click',()=>modal.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
document.getElementById('rsvpForm').addEventListener('submit',e=>{
  e.preventDefault();
  const data={name:rsvpName.value,status:rsvpStatus.value,count:rsvpCount.value,note:rsvpNote.value,at:new Date().toISOString()};
  const arr=JSON.parse(localStorage.getItem('wedding-rsvp')||'[]'); arr.push(data);
  localStorage.setItem('wedding-rsvp',JSON.stringify(arr)); modal.classList.remove('show'); e.target.reset();
  toast('Cảm ơn bạn đã xác nhận 💌');
});

document.getElementById('guestForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('guestName').value.trim(),wish=document.getElementById('guestWish').value.trim();
  if(!name||!wish){toast('Bạn nhập tên và lời chúc nhé');return}
  const arr=JSON.parse(localStorage.getItem('wedding-wishes')||'[]'); arr.push({name,wish,at:new Date().toISOString()});
  localStorage.setItem('wedding-wishes',JSON.stringify(arr)); e.target.reset();
  toast('Đã gửi lời chúc. Cảm ơn bạn! ❤️');
});
</script>
</body>
</html>
